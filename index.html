<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#2c2d32">
<title>Discord Badge Unlocker</title>
<link rel="stylesheet" href="assets/style.css">
<script type="module" src="assets/app.js"></script>
</head>
<body>
<header class="titlebar">
  <div class="title"><span class="app-icon" aria-hidden="true"></span>Discord Badge Unlocker</div>
  <span id="catalog-status" class="status" data-state="loading" role="status"><span class="dot" aria-hidden="true"></span><span class="text">Loading</span></span>
</header>
<div class="shell">
  <nav class="rail" aria-hidden="true"><span class="rail-pill"></span><span class="rail-icon"></span></nav>
  <main class="panel">
    <div class="content">
      <div id="start" class="start"><button id="load-generator" class="btn primary lg" type="button">Load generator</button></div>
      <section id="generator" class="gen" hidden></section>
    </div>
  </main>
</div>
</body>
</html>
